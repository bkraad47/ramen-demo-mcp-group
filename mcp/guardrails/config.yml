# NeMo Guardrails config for the demo group: the group's own input and output flows (rails.co, actions.py), no model.
# `models: []` stays empty on purpose (Ramen 1.0.0c, CONTRACTS §36.1): the worker fills it at load from the LLM
# provider the group (or the org) set on the console, for the LLM rails named in mcp/guardrails.yaml. The flows for
# those rails are generated by the worker; prompts.yml here overrides the prompts it would generate.
models: []
rails:
  input:
    flows:
      - block prompt injection
  output:
    flows:
      - block leaked secrets
      - block outlier dump
