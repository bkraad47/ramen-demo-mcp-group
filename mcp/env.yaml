# Environment for this group's tool code (Ramen 0.6.0). The worker renders this file at every load and exports each
# key to the Python runtime, so a tool reads `os.environ["DEMO_MODE"]`. A value may reference one of the group's
# secrets as {{$<group>.<SECRET>}} — set on the console's Secrets page — and the worker substitutes it; a reference
# with no secret behind it is skipped with a warning, the rest of the file still applies. Values are never logged.
DEMO_MODE: demo
DEMO_API_TOKEN: "{{$demo.DEMO_API_TOKEN}}"   # only present when the group has a DEMO_API_TOKEN secret
